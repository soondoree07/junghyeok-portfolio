<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Park Junghyeok — Portfolio · Bubble</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FAF1F8;
    --bg-2: #F4F1FA;
    --bg-3: #F1F8FA;
    --ink: #3D2D4D;
    --ink-soft: #5C4A6E;
    --muted: #998BAE;
    --rule: rgba(61,45,77,0.10);
    --rule-strong: rgba(61,45,77,0.18);
    --card-bg: rgba(255,255,255,0.55);
    --card-bg-hi: rgba(255,255,255,0.75);
    --pink: #FF8FB8;
    --peach: #FFC58F;
    --yellow: #FFEEA8;
    --mint: #A8E6C8;
    --cyan: #A8D9F0;
    --lilac: #C8B8F0;
    --rainbow: linear-gradient(90deg, #FF8FB8 0%, #FFB58F 20%, #FFEEA8 40%, #A8E6C8 60%, #A8D9F0 80%, #C8B8F0 100%);
    --pad: 56px;
    --card-w: 340px;
    --card-h: 500px;
    --gap: 26px;
    --r-card: 28px;
    --r-pill: 999px;
    --display: 'Fredoka', 'Gowun Dodum', sans-serif;
    --kr: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
    --mono: 'Fredoka', 'Gowun Dodum', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    color: var(--ink);
    font-family: var(--kr);
    background:
      radial-gradient(ellipse 70% 50% at 18% 18%, rgba(255,193,219,0.55), transparent 60%),
      radial-gradient(ellipse 60% 60% at 88% 12%, rgba(193,225,255,0.55), transparent 60%),
      radial-gradient(ellipse 70% 60% at 12% 88%, rgba(220,255,228,0.55), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 92%, rgba(231,210,255,0.6), transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 55%, rgba(255,240,200,0.4), transparent 70%),
      linear-gradient(180deg, #FAF1F8 0%, #F0F5FA 50%, #F8F1FA 100%);
    background-attachment: fixed;
  }
  body { min-height: 100vh; overflow-x: hidden; padding-top: 64px; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--pink); }

  /* ============ TOPBAR ============ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 16px var(--pad);
    background: rgba(255,253,255,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--rule);
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
    letter-spacing: 0;
    transition: padding 0.22s ease;
  }
  .topbar.scrolled { padding: 10px var(--pad); }
  .tb-left { display: inline-flex; align-items: center; gap: 12px; }
  .tb-orb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--rainbow);
    box-shadow:
      0 0 14px rgba(255,143,184,0.4),
      0 0 28px rgba(168,217,240,0.3),
      inset 0 0 8px rgba(255,255,255,0.7);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .tb-badge { font-weight: 600; color: var(--ink); }
  .tb-mid { justify-self: center; }
  .tb-status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: var(--r-pill);
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .tb-status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 10px rgba(168,230,200,0.7);
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.15); } }
  .tb-right { justify-self: end; }
  .lang {
    display: inline-flex;
    padding: 3px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
    gap: 3px;
  }
  .lang button {
    padding: 5px 14px;
    font-family: var(--display); font-weight: 600; font-size: 12px;
    border-radius: var(--r-pill);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
  }
  .lang button.on {
    background: var(--rainbow);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    box-shadow:
      0 4px 14px rgba(255,143,184,0.3),
      inset 0 1px 2px rgba(255,255,255,0.5);
  }
  .lang button:hover:not(.on) { color: var(--ink); }

  /* ============ VIEW ============ */
  .view { animation: viewIn 0.5s cubic-bezier(0.2,0.7,0.2,1) both; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .view, .marquee, .tb-orb, .tb-status-dot, .status-dot, .dk-orb, .hk-orb, .bubble {
      animation: none !important; transition: none !important;
    }
  }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    padding: 88px var(--pad) 64px;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    animation: drift 16s ease-in-out infinite alternate;
  }
  .bubble.b1 { width: 360px; height: 360px; background: var(--pink);  top: -60px;  left: 8%; }
  .bubble.b2 { width: 320px; height: 320px; background: var(--cyan);  top: 80px;   right: 12%;  animation-delay: -3s; }
  .bubble.b3 { width: 280px; height: 280px; background: var(--mint);  bottom: -40px; left: 30%;  animation-delay: -7s; }
  .bubble.b4 { width: 240px; height: 240px; background: var(--lilac); top: 30%;    right: 38%;  animation-delay: -10s; }
  .bubble.b5 { width: 200px; height: 200px; background: var(--peach); bottom: 20%; right: 6%;   animation-delay: -5s; }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(30px, -25px) scale(1.12); }
  }
  .hero-inner { position: relative; z-index: 1; }

  .hero-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
    font-family: var(--display); font-weight: 500; font-size: 13px;
    color: var(--ink-soft);
  }
  .hero-kicker { display: inline-flex; align-items: center; gap: 10px; }
  .hk-orb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--rainbow);
    box-shadow: 0 0 10px rgba(255,143,184,0.6);
    animation: pulse 1.6s infinite ease-in-out;
  }
  .hero-loc { color: var(--ink-soft); }

  .hero-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(72px, 15vw, 220px);
    line-height: 0.92;
    letter-spacing: -0.04em;
    margin: 12px 0 36px;
    color: var(--ink);
    display: flex; flex-direction: column;
  }
  .hero-line { display: block; }
  .hero-line .dot { color: var(--pink); }
  .hero-line.grad {
    background: linear-gradient(90deg, #FF8FB8 0%, #FFB58F 20%, #E6D060 38%, #6ECF9A 58%, #6BB6E0 78%, #B89BE0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(255,143,184,0.25)) drop-shadow(0 -2px 18px rgba(168,217,240,0.2));
  }

  .hero-bottom {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 36px;
    padding-top: 24px;
    border-top: 1px dashed var(--rule-strong);
    align-items: start;
  }
  .hero-role {
    font-size: 16px; line-height: 1.75;
    color: var(--ink-soft);
    max-width: 580px;
    font-weight: 400;
  }
  .hero-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: flex-end;
  }
  .meta-pill {
    font-family: var(--display);
    font-weight: 500; font-size: 12px;
    padding: 6px 14px;
    border-radius: var(--r-pill);
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* ============ WORKS ============ */
  .works-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 24px;
    padding: 36px var(--pad) 14px;
  }
  .works-left { display: flex; flex-direction: column; gap: 6px; }
  .section-kicker {
    font-family: var(--display);
    font-weight: 600; font-size: 13px;
    color: var(--pink);
    letter-spacing: 0.04em;
  }
  .section-meta {
    font-family: var(--display);
    font-weight: 600; font-size: 26px;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .works-right { display: inline-flex; align-items: center; gap: 14px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--display);
    font-weight: 500; font-size: 12px;
    color: var(--muted);
    padding: 6px 14px;
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s;
  }
  .status.on { color: var(--ink); }
  .status.on .status-dot {
    background: var(--pink);
    box-shadow: 0 0 10px rgba(255,143,184,0.6);
    animation: pulse 1s infinite ease-in-out;
  }
  .arrows { display: inline-flex; gap: 8px; }
  .arrows button {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    font-family: var(--display); font-size: 16px;
    color: var(--ink);
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
  }
  .arrows button:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.9);
    box-shadow:
      0 6px 20px rgba(255,143,184,0.25),
      0 0 0 1px rgba(255,143,184,0.4);
  }

  .works-nudge {
    padding: 0 var(--pad) 14px;
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
    color: var(--muted);
  }

  /* ============ MARQUEE ============ */
  .marquee-wrap {
    position: relative; padding: 20px 0 64px;
    overflow: hidden;
  }
  .marquee-wrap.scroll-mode {
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .marquee-wrap.scroll-mode::-webkit-scrollbar { display: none; }
  .marquee:has(.card:hover):not(.no-anim) { animation-play-state: paused; }
  .marquee {
    display: flex; gap: var(--gap);
    width: max-content;
    padding: 14px var(--pad);
    animation: scroll 100s linear infinite;
    will-change: transform;
  }
  .marquee.no-anim { animation: none; }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--distance, -50%)); }
  }

  /* ============ CARD ============ */
  .card {
    position: relative;
    width: var(--card-w);
    min-height: var(--card-h);
    border-radius: var(--r-card);
    padding: 22px 22px 24px;
    background: var(--card-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -1px 0 rgba(61,45,77,0.04) inset,
      0 18px 40px -22px rgba(61,45,77,0.18);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.18s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.25s;
    scroll-snap-align: start;
    cursor: pointer;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: var(--rainbow);
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .card:hover {
    transform: scale(1.02) translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 28px 56px -28px rgba(61,45,77,0.28),
      0 0 36px color-mix(in srgb, var(--card-accent) 28%, transparent);
    z-index: 2;
  }
  .card:hover::before { opacity: 1; }

  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .card-num {
    font-family: var(--display);
    font-weight: 600; font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .card-cat {
    font-family: var(--display); font-weight: 500; font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 12px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
  }

  .card-thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow:
      0 4px 18px rgba(255,143,184,0.15),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .card-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 25% 20%, rgba(255,255,255,0.55), transparent 45%);
    pointer-events: none;
  }
  .thumb-num {
    position: absolute; left: 16px; top: 14px;
    font-family: var(--display);
    font-weight: 700; font-size: 32px;
    color: rgba(255,255,255,0.95);
    letter-spacing: -0.03em;
    text-shadow: 0 2px 8px rgba(61,45,77,0.18);
  }
  .thumb-label {
    position: absolute; left: 16px; bottom: 14px;
    font-family: var(--display); font-weight: 500; font-size: 12px;
    color: rgba(61,45,77,0.7);
    background: rgba(255,255,255,0.65);
    padding: 4px 10px;
    border-radius: var(--r-pill);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .thumb-mark {
    position: absolute; right: 14px; top: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display);
    font-size: 14px; color: var(--ink);
  }
  .thumb-live {
    position: absolute; right: 14px; bottom: 14px;
    font-family: var(--display); font-weight: 600; font-size: 11px;
    padding: 4px 10px;
    background: var(--rainbow);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    border-radius: var(--r-pill);
    box-shadow: 0 4px 12px rgba(255,143,184,0.35);
  }

  .card-title {
    font-family: var(--display);
    font-weight: 700; font-size: 24px;
    letter-spacing: -0.02em;
    margin: 4px 0 8px;
    color: var(--ink);
    line-height: 1.05;
  }
  .card-tagline {
    font-size: 14px; line-height: 1.6;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-tags span {
    font-family: var(--display); font-weight: 500; font-size: 11.5px;
    padding: 5px 11px;
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
    color: var(--ink-soft);
  }
  .card-year {
    font-family: var(--display); font-weight: 500; font-size: 12px;
    color: var(--muted);
  }

  /* ============ DETAIL ============ */
  .detail { padding: 28px var(--pad) 72px; }
  .detail-toolbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 24px; align-items: center;
    padding-bottom: 22px;
    border-bottom: 1px dashed var(--rule-strong);
    margin-bottom: 26px;
  }
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    white-space: nowrap;
  }
  .back:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.9);
    box-shadow: 0 6px 16px rgba(255,143,184,0.25);
  }
  .kb-hint {
    font-family: var(--display); font-size: 12px; font-weight: 400;
    color: var(--muted); text-align: center;
  }
  .prev-next { display: inline-flex; gap: 10px; }
  .prev-next button {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
    transition: background 0.2s, transform 0.15s;
    max-width: 220px;
  }
  .prev-next button:hover { background: rgba(255,255,255,0.95); transform: translateY(-1px); }
  .prev-next .pn-l, .prev-next .pn-r { font-family: var(--display); font-size: 13px; color: var(--ink-soft); }
  .prev-next .pn-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .prev-next .pn-meta.align-r { align-items: flex-end; }
  .prev-next .pn-lbl {
    font-family: var(--display); font-weight: 500; font-size: 10.5px;
    color: var(--muted);
  }
  .prev-next .pn-title {
    font-family: var(--display); font-weight: 600; font-size: 13px;
    color: var(--ink); max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .detail-kicker {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
    padding: 18px 0;
    color: var(--ink);
    margin-bottom: 28px;
  }
  .dk-orb {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--rainbow); margin-right: 10px;
    box-shadow: 0 0 10px rgba(255,143,184,0.55);
    vertical-align: -1px;
    animation: pulse 1.4s infinite ease-in-out;
  }
  .dk-r { color: var(--muted); }

  .detail-body {
    display: grid; grid-template-columns: 1.1fr 1fr;
    gap: 56px; align-items: start;
  }
  .db-left { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 18px; }
  .big-thumb {
    position: relative; overflow: hidden;
    aspect-ratio: 4 / 5;
    border-radius: var(--r-card);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 26px 60px -28px rgba(61,45,77,0.3),
      0 0 60px color-mix(in srgb, var(--card-accent) 28%, transparent);
  }
  .big-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 22% 18%, rgba(255,255,255,0.5), transparent 50%);
    pointer-events: none;
  }
  .big-num {
    position: absolute; left: 28px; top: 24px;
    font-family: var(--display);
    font-weight: 700; font-size: 68px;
    color: rgba(255,255,255,0.97);
    letter-spacing: -0.03em;
    text-shadow: 0 4px 14px rgba(61,45,77,0.18);
  }
  .big-label {
    position: absolute; left: 28px; bottom: 26px;
    font-family: var(--display); font-weight: 500; font-size: 13px;
    color: var(--ink);
    background: rgba(255,255,255,0.75);
    padding: 6px 14px;
    border-radius: var(--r-pill);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .big-mark {
    position: absolute; right: 22px; top: 22px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display);
    font-size: 16px; color: var(--ink);
  }

  .big-meta {
    display: grid; gap: 0;
    padding: 18px 22px;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: var(--r-card);
    box-shadow: 0 16px 40px -22px rgba(61,45,77,0.18);
  }
  .big-meta-row {
    display: grid; grid-template-columns: 90px 1fr; gap: 12px;
    padding: 10px 0;
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
  }
  .big-meta-row + .big-meta-row { border-top: 1px dashed var(--rule); }
  .bmk { color: var(--muted); font-weight: 500; }
  .bmv { color: var(--ink); }
  .bmv.muted { color: var(--muted); }

  .db-right { display: flex; flex-direction: column; gap: 32px; }
  .db-kicker {
    font-family: var(--display); font-weight: 600; font-size: 13px;
    color: var(--pink);
  }
  .db-title {
    font-family: var(--display);
    font-weight: 700; font-size: clamp(48px, 6.5vw, 88px);
    letter-spacing: -0.035em; line-height: 0.96;
    margin: -8px 0 4px;
    background: var(--rainbow);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255,143,184,0.2));
  }
  .db-tagline {
    font-size: 17px; line-height: 1.7;
    color: var(--ink-soft);
    max-width: 580px;
  }

  .block .block-label {
    font-family: var(--display);
    font-weight: 600; font-size: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--rule-strong);
    margin-bottom: 16px;
    color: var(--ink);
    display: flex; align-items: baseline; gap: 10px;
  }
  .bl-num {
    font-family: var(--display); font-weight: 700; font-size: 14px;
    background: var(--rainbow);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  .bullets { list-style: none; margin: 0; padding: 0; }
  .bullets li {
    font-size: 15.5px; line-height: 1.75;
    padding: 14px 0 14px 26px;
    border-bottom: 1px dashed var(--rule);
    position: relative;
    color: var(--ink-soft);
  }
  .bullets li::before {
    content: ''; position: absolute; left: 0; top: 22px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--rainbow);
    box-shadow: 0 0 6px rgba(255,143,184,0.5);
  }

  .outcomes { display: grid; gap: 10px; }
  .outcome {
    display: grid; grid-template-columns: 150px 1fr; gap: 16px;
    align-items: baseline;
    padding: 14px 18px;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 18px;
  }
  .outcome-big {
    font-family: var(--display);
    font-weight: 700; font-size: 26px;
    letter-spacing: -0.025em;
    background: var(--rainbow);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .outcome-lbl {
    font-family: var(--display);
    font-weight: 500; font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-row span {
    font-family: var(--display); font-weight: 500; font-size: 12.5px;
    padding: 7px 16px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--rule);
    border-radius: var(--r-pill);
    color: var(--ink);
  }

  .visit {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 26px;
    background: var(--rainbow);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    font-family: var(--display); font-weight: 700; font-size: 14px;
    border-radius: var(--r-pill);
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow:
      0 8px 24px rgba(255,143,184,0.35),
      inset 0 1px 2px rgba(255,255,255,0.5);
  }
  .visit:hover {
    transform: translateY(-2px);
    box-shadow:
      0 12px 30px rgba(255,143,184,0.45),
      inset 0 1px 2px rgba(255,255,255,0.5);
    color: #fff;
  }

  /* ============ FOOTER + TOAST ============ */
  .footer {
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink);
    padding: 28px var(--pad);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    align-items: center;
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
    border-top: 1px solid var(--rule);
  }
  .footer-c { text-align: center; color: var(--muted); }
  .footer-r { text-align: right; display: inline-flex; justify-content: flex-end; gap: 10px; align-items: center; flex-wrap: wrap; }
  .footer-r a { color: var(--ink); }
  .footer-r a:hover { color: var(--pink); }
  .footer-sep { color: var(--muted); }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink);
    padding: 12px 20px;
    border: 1px solid rgba(255,143,184,0.4);
    border-radius: var(--r-pill);
    font-family: var(--display);
    font-weight: 500; font-size: 13px;
    z-index: 150;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    box-shadow: 0 14px 30px rgba(255,143,184,0.25);
  }
  .toast.on { opacity: 1; transform: translateY(0); }
  .t-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rainbow);
    box-shadow: 0 0 8px rgba(255,143,184,0.5);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1080px) {
    .works-head { flex-direction: column; align-items: flex-start; gap: 14px; }
    .works-right { align-self: flex-start; }
    .detail-toolbar { grid-template-columns: 1fr; gap: 14px; }
    .kb-hint { display: none; }
    .detail-body { grid-template-columns: 1fr; gap: 32px; }
    .db-left { position: static; }
    .big-thumb { aspect-ratio: 4 / 3; }
  }
  @media (max-width: 900px) {
    :root { --pad: 24px; --card-w: 280px; --card-h: 440px; }
    body { padding-top: 58px; }
    .topbar { font-size: 11px; padding: 12px var(--pad); grid-template-columns: 1fr auto; }
    .tb-mid { display: none; }
    .hero { padding: 56px var(--pad) 36px; }
    .hero-bottom { grid-template-columns: 1fr; gap: 18px; }
    .hero-meta { justify-content: flex-start; }
    .footer { grid-template-columns: 1fr; text-align: left; }
    .footer-c, .footer-r { text-align: left; justify-content: flex-start; }
    .outcome { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
